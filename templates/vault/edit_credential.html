{% extends 'base.html' %}

{% block title %}Edit Credential - PasMan{% endblock %}

{% block content %}
<div class="grid grid-cols-4 gap-6 p-6 min-h-screen">
    <!-- Sidebar Navigation -->
    <div class="col-span-1 bg-gray-950 border-4 border-purple-500 rounded-lg p-4 shadow-neon h-fit sticky top-6">
        <h3 class="text-yellow-300 font-arcade text-lg mb-4 border-b-2 border-purple-500 pb-2">📋 MENU</h3>
        
        <nav class="space-y-2">
            <a href="{% url 'vault:dashboard' %}" class="block px-4 py-2 border-2 border-yellow-300 text-yellow-300 rounded hover:bg-yellow-300 hover:text-gray-900 transition-colors font-bold text-sm">Dashboard</a>
            <a href="{% url 'vault:password_generator' %}" class="block px-4 py-2 border-2 border-pink-300 text-pink-300 rounded hover:bg-pink-300 hover:text-gray-900 transition-colors font-bold text-sm">Password Generator</a>
        </nav>
    </div>

    <!-- Form -->
    <div class="col-span-3">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-900 via-purple-900 to-pink-900 border-4 border-yellow-300 p-6 rounded-lg shadow-neon mb-6">
            <h1 class="text-3xl font-arcade text-yellow-300">✏️ EDIT CREDENTIAL</h1>
            <p class="text-sm text-pink-300 mt-2">{{ credential.website_name }}</p>
        </div>

        <!-- Form Card -->
        <div class="border-4 border-purple-500 bg-gray-900 p-6 rounded-lg shadow-neon">
            <form method="post" class="space-y-5">
                {% csrf_token %}

                <!-- Website Name -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">WEBSITE NAME</label>
                    <input type="text" name="website_name" value="{{ credential.website_name }}" required
                        class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                </div>

                <!-- Website URL -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">WEBSITE URL</label>
                    <input type="url" name="website_url" value="{{ credential.website_url|default:'' }}"
                        class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                </div>

                <!-- Username -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">USERNAME</label>
                    <input type="text" name="username" value="{{ credential.username }}" required
                        class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                </div>

                <!-- Email -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">EMAIL</label>
                    <input type="email" name="email" value="{{ credential.email|default:'' }}"
                        class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                </div>

                <!-- Password -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">PASSWORD (leave blank to keep current)</label>
                    <div class="flex gap-2 mt-2">
                        <input type="password" name="password" id="password-field" placeholder="●●●●●●●●"
                            class="flex-1 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                        <button type="button" onclick="generatePassword()" class="px-4 py-3 border-2 border-pink-300 text-pink-300 hover:bg-pink-300 hover:text-gray-900 transition-colors font-bold rounded">
                            🎲
                        </button>
                    </div>
                </div>

                <!-- Password Strength Indicator -->
                <div id="strength-container" class="hidden">
                    <div class="text-sm text-yellow-300">Password Strength:</div>
                    <div class="w-full h-3 bg-gray-700 rounded-lg mt-2 overflow-hidden">
                        <div id="strength-bar" class="h-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <div id="strength-text" class="text-xs mt-2"></div>
                </div>

                <!-- Category -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">CATEGORY</label>
                    <select name="category" class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 focus:outline-none focus:border-yellow-300">
                        <option value="other" {% if credential.category == 'other' %}selected{% endif %}>Other</option>
                        <option value="email" {% if credential.category == 'email' %}selected{% endif %}>Email</option>
                        <option value="social" {% if credential.category == 'social' %}selected{% endif %}>Social Media</option>
                        <option value="work" {% if credential.category == 'work' %}selected{% endif %}>Work</option>
                        <option value="finance" {% if credential.category == 'finance' %}selected{% endif %}>Finance</option>
                    </select>
                </div>

                <!-- Notes -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">NOTES</label>
                    <textarea name="notes" rows="4"
                        class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">{{ credential.notes|default:'' }}</textarea>
                </div>

                <!-- Submit -->
                <div class="flex gap-3 pt-4 border-t-2 border-purple-500">
                    <button type="submit" class="flex-1 px-6 py-3 border-3 border-yellow-300 bg-gray-900 text-yellow-300 font-arcade text-lg hover:bg-yellow-300 hover:text-gray-900 transition-all transform hover:scale-105 shadow-neon rounded">
                        SAVE CHANGES
                    </button>
                    <a href="{% url 'vault:credential_detail' credential.pk %}" class="flex-1 px-6 py-3 border-3 border-gray-500 text-gray-500 text-center font-arcade text-lg hover:bg-gray-500 hover:text-gray-900 transition-all rounded">
                        CANCEL
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('password-field').addEventListener('input', function() {
    const password = this.value;
    if (password.length === 0) {
        document.getElementById('strength-container').style.display = 'none';
        return;
    }
    
    document.getElementById('strength-container').style.display = 'block';
    
    let score = 0;
    if (password.length >= 8) score++;
    if (password.length >= 12) score++;
    if (password.length >= 16) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;
    
    const finalScore = Math.min(Math.max(Math.ceil(score / 1.4), 1), 5);
    const percent = (finalScore / 5) * 100;
    const colors = ['red', 'orange', 'yellow', 'green', 'darkgreen'];
    const labels = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
    
    const bar = document.getElementById('strength-bar');
    bar.style.width = percent + '%';
    bar.style.backgroundColor = colors[finalScore - 1];
    document.getElementById('strength-text').textContent = labels[finalScore - 1];
});

function generatePassword() {
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()';
    let password = '';
    for (let i = 0; i < 16; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById('password-field').value = password;
    document.getElementById('password-field').dispatchEvent(new Event('input'));
}
</script>
{% endblock %}
