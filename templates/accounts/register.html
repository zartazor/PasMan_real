{% extends 'base.html' %}

{% block title %}Register - PasMan{% endblock %}

{% block content %}
<div class="w-full min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900 p-4">
    <div class="w-full max-w-md">
        <div class="border-4 border-pink-300 bg-gray-900 p-8 rounded-lg shadow-neon space-y-6">
            <!-- Header -->
            <div class="text-center">
                <h1 class="text-4xl font-arcade text-pink-300 tracking-wider">🎮 REGISTER</h1>
                <p class="text-sm text-yellow-300 mt-2">New Player Detected</p>
            </div>

            <!-- Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">USERNAME</label>
                    <input type="text" name="username" placeholder="Choose your name" required
                        class="w-full mt-2 px-4 py-3 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                </div>

                <!-- Password -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">PASSWORD</label>
                    <div class="relative mt-2">
                        <input type="password" name="password" id="register-password-field" placeholder="●●●●●●●●" required
                            class="w-full px-4 py-3 pr-20 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                        <button type="button" onclick="togglePasswordField('register-password-field', this)" aria-label="Show password"
                            class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 border border-pink-300 text-pink-300 text-xs font-bold rounded hover:bg-pink-300 hover:text-gray-900">SHOW</button>
                    </div>
                    <p class="text-xs text-gray-400 mt-2">Min 8 characters</p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="text-sm font-arcade text-yellow-300">CONFIRM PASSWORD</label>
                    <div class="relative mt-2">
                        <input type="password" name="password_confirm" id="register-password-confirm-field" placeholder="●●●●●●●●" required
                            class="w-full px-4 py-3 pr-20 rounded-lg border-2 border-purple-500 bg-gray-800 text-yellow-300 placeholder-gray-500 focus:outline-none focus:border-yellow-300">
                        <button type="button" onclick="togglePasswordField('register-password-confirm-field', this)" aria-label="Show password"
                            class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 border border-pink-300 text-pink-300 text-xs font-bold rounded hover:bg-pink-300 hover:text-gray-900">SHOW</button>
                    </div>
                </div>

                <!-- Register Button -->
                <button type="submit" class="w-full mt-6 px-6 py-3 border-3 border-pink-300 bg-gray-900 text-pink-300 font-arcade text-lg hover:bg-pink-300 hover:text-gray-900 transition-all transform hover:scale-105 shadow-neon">
                    CREATE ACCOUNT
                </button>
            </form>

            <!-- Login Link -->
            <div class="text-center pt-4 border-t-2 border-purple-500">
                <p class="text-sm text-gray-400">Already have an account?</p>
                <a href="{% url 'accounts:login' %}" class="text-yellow-300 font-arcade hover:text-yellow-100 transition-colors">
                    LOGIN HERE
                </a>
            </div>
        </div>

        <!-- Decorative Ghosts -->
        <div class="text-center mt-8 text-2xl animate-bounce">
            👻 👻 👻
        </div>
    </div>
</div>
{% endblock %}
